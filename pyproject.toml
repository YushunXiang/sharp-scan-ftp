[project]
name = "sharp-scan-ftp"
version = "0.1.0"
description = "Workspace-local FTP receiver for network scanners on macOS"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pyftpdlib==2.2.0",
    "pyasyncore==1.0.5",
    "pyasynchat==1.0.5",
]

[project.scripts]
ftp-cli = "sharp_scan_ftp.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["config.example.toml", "src/ftp-cli", "uv.lock"]
